{% extends "base.html" %}
{% block title %}Superadmin — MFS Gateway{% endblock %}
{% block content %}
<div class="section" style="margin-top:24px;">
  <h1>Superadmin <span class="gradient-text">Console</span></h1>
  <p class="muted">Full control over merchants, devices, transactions and system logs.</p>

  <div class="grid grid-4" id="stats" style="margin-bottom:10px;"></div>

  <div class="tabs" style="margin: 18px 0;">
    <button class="tab active" data-pane="merchants">Merchants</button>
    <button class="tab" data-pane="devices">Devices</button>
    <button class="tab" data-pane="transactions">Transactions</button>
    <button class="tab" data-pane="sms">SMS Logs</button>
  </div>

  <div class="glass pad">
    <div id="pane-merchants" class="pane"></div>
    <div id="pane-devices" class="pane" style="display:none;"></div>
    <div id="pane-transactions" class="pane" style="display:none;"></div>
    <div id="pane-sms" class="pane" style="display:none;"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
