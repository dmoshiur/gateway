<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Registration · UniquePay BD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, sans-serif; }
  .glass { background: rgba(15,18,38,.75); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.08); }
  .grid-bg { background-image: linear-gradient(rgba(34,255,224,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,255,224,.06) 1px, transparent 1px); background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 30%, #000 30%, transparent 100%); }
  .neon-line { background: linear-gradient(90deg, transparent, #22ffe0 30%, #e2136e 70%, transparent); height: 1px; }
  .fade-up { animation: fadeUp .5s ease both; } @keyframes fadeUp { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
</style>
  <link rel="stylesheet" href="{{ url_for('static', filename='light-theme.css') }}">
</head>
<body class="bg-[#05060f] text-slate-200 min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
<div class="grid-bg absolute inset-0 pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(226,19,110,.2), transparent 65%)"></div>

<div class="glass w-full max-w-sm rounded-3xl overflow-hidden fade-up relative z-10">
  <div class="neon-line"></div>
  <div class="p-8">
    <div class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-[#e2136e] font-bold text-xl mb-5 shadow-[0_0_28px_-6px_rgba(226,19,110,.7)]" style="font-family:'Space Grotesk'">৳</div>
    <h1 class="text-xl font-bold text-white" style="font-family:'Space Grotesk'">Become a Merchant</h1>
    <p class="text-xs text-slate-500 mt-1 mb-6">Unlimited API keys · Live SMS-driven verification · No monthly fee.</p>

    {% if error %}
    <div class="mb-4 rounded-xl border border-rose-400/40 bg-rose-500/10 text-rose-300 text-xs px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div>
        <label class="text-[11px] uppercase tracking-widest text-slate-500">Business name</label>
        <input name="name" required maxlength="120"
               class="mt-1.5 w-full glass rounded-xl px-4 py-3 text-sm text-white border border-white/10 focus:border-[#22ffe0]/60">
      </div>
      <div>
        <label class="text-[11px] uppercase tracking-widest text-slate-500">Email</label>
        <input name="email" type="email" required maxlength="120" autocomplete="email"
               class="mt-1.5 w-full glass rounded-xl px-4 py-3 text-sm text-white border border-white/10 focus:border-[#22ffe0]/60">
      </div>
      <div>
        <label class="text-[11px] uppercase tracking-widest text-slate-500">Password (8+ chars)</label>
        <input name="password" type="password" required minlength="8" autocomplete="new-password"
               class="mt-1.5 w-full glass rounded-xl px-4 py-3 text-sm text-white border border-white/10 focus:border-[#22ffe0]/60">
      </div>
      <button class="w-full py-3.5 rounded-2xl text-sm font-semibold text-[#05060f] tracking-wide transition hover:brightness-110"
              style="background: linear-gradient(120deg, #e2136e, #ff5e9c); box-shadow: 0 8px 28px -8px rgba(226,19,110,.7); font-family:'Space Grotesk'">
        Create Merchant Account →
      </button>
    </form>
    <p class="text-center text-xs text-slate-500 mt-5">Already registered?
      <a href="/login" class="text-[#22ffe0] hover:underline">Sign in</a></p>
  </div>
</div>
</body>
</html>
